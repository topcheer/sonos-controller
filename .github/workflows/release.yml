name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            dpkg \
            rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Sonos Controller ${{ github.ref_name }}"
          releaseBody: |
            See the assets below to download the installer for your platform.

            ## Install

            ### Homebrew (Linux)
            ```
            brew tap topcheer/sonos-controller
            brew install --cask sonos-controller
            ```

            ### Manual download
            - **AppImage** — Portable, no installation needed (`chmod +x` and run)
            - **.deb** — Ubuntu/Debian: `sudo dpkg -i *.deb`
            - **.rpm** — Fedora/openSUSE: `sudo rpm -i *.rpm`
            - **.tar.gz** — Extract and run
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

  # Package AppImage into tar.gz and create Homebrew tap
  homebrew:
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.AppImage" \
            --pattern "*.tar.gz" || true

      - name: Create tar.gz from AppImage
        run: |
          APPIMAGE=$(ls *.AppImage 2>/dev/null | head -1)
          if [ -n "$APPIMAGE" ]; then
            mkdir -p sonos-controller
            cp "$APPIMAGE" sonos-controller/sonos-controller
            chmod +x sonos-controller/sonos-controller
            tar czf "sonos-controller_${{ steps.version.outputs.VERSION }}_linux_x86_64.tar.gz" sonos-controller/
            echo "Created tar.gz: $(ls *.tar.gz)"
          fi

      - name: Upload tar.gz to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGZ=$(ls *.tar.gz 2>/dev/null | head -1)
          if [ -n "$TARGZ" ]; then
            gh release upload "$GITHUB_REF_NAME" "$TARGZ" --repo "$GITHUB_REPOSITORY" --clobber
          fi

      - name: Compute SHA256
        id: sha
        run: |
          TARGZ=$(ls *.tar.gz 2>/dev/null | head -1)
          if [ -n "$TARGZ" ]; then
            SHA=$(sha256sum "$TARGZ" | cut -d' ' -f1)
            echo "SHA=$SHA" >> "$GITHUB_OUTPUT"
            echo "SHA256: $SHA"
          fi

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          SHA="${{ steps.sha.outputs.SHA }}"

          if [ -z "$SHA" ]; then
            echo "No tar.gz found, skipping tap update"
            exit 0
          fi

          REPO="topcheer/homebrew-sonos-controller"
          gh repo create "$REPO" --public --description "Homebrew tap for Sonos Controller" 2>/dev/null || true

          # Clone or init the tap repo
          mkdir -p /tmp/tap-repo/Casks
          cd /tmp/tap-repo
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" . 2>/dev/null || git init

          # Generate the Cask file
          cat > Casks/sonos-controller.rb << RUBY
          cask "sonos-controller" do
            version "#{VERSION}"
            sha256 "#{SHA}"

            url "https://github.com/topcheer/sonos-controller/releases/download/v#{version}/sonos-controller_#{version}_linux_x86_64.tar.gz"
            name "Sonos Controller"
            desc "Unofficial Sonos Controller for Linux"
            homepage "https://github.com/topcheer/sonos-controller"

            binary "sonos-controller/sonos-controller"
          end
          RUBY

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update sonos-controller to v${VERSION}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" 2>/dev/null || true
          git branch -M main
          git push -u origin main --force
